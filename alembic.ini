# Alembic configuration. The database URL is deliberately blank: env.py takes it from the
# INSIGHTMINER_DB_URL environment variable, from `-x db_url=sqlite:///...`, or from a
# connection handed in programmatically through config.attributes["connection"].
[alembic]
script_location = src/insightminer/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
