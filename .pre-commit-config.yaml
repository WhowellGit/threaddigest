# Runs on every commit once `make setup` has run `pre-commit install`.
# CI runs the same tools through `make check`; this is the fast local copy of that gate.
# Revisions are pinned; bump them deliberately (with the monthly dependency bump), never blindly.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
        exclude: ^docs/reference/   # immutable copies of external material
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: ^docs/reference/
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7  # keep in step with the ruff version in uv.lock
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: dmypy
        name: mypy --strict on the whole src tree (dmypy)
        entry: uv run dmypy --status-file .build/dmypy.json run -- src
        language: system
        pass_filenames: false
        types_or: [python, pyi, toml]
