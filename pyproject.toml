[project]
name = "threaddigest"
version = "0.1.0"
description = "Personal, rules-compliant Reddit reader that surfaces Premiere Pro quality signals"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  # Pinned to the tested major (KI, external round one, reviewer C-11): PRAW 8's `replace_more`
  # discovers up to 100 comments per request where PRAW 7 discovered 20, and the collector's
  # budgeting assumes the tested behaviour. A major upgrade is deliberate: bump the ceiling
  # after replaying the adapter contract fixtures on the probe day.
  "praw>=8,<9",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "typer>=0.15",
  "rich>=13.9",
  "regex>=2024.11.6",
  "markdown-it-py>=3.0",
  "nh3>=0.2.18",
  "pyyaml>=6.0",
  # The IANA zone database as a package, not an assumption about the host. `display_timezone`
  # is resolved with `zoneinfo`, which reads the system database and has none to read in a
  # slim container (the first CI run: `America/Los_Angeles` was unknown on Ubuntu 24.04 with
  # no tzdata package). A runtime dependency, not a dev one: the digest renders on whatever
  # machine runs the schedule.
  "tzdata>=2025.2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
]

[project.scripts]
threaddigest = "threaddigest.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-recording>=0.13",
  "responses>=0.25",
  "hypothesis>=6.115",
  "time-machine>=2.16",
  "pytest-alembic>=0.11",
  "selectolax>=0.3.21",
  "httpx>=0.27",
  # Starlette 1.6's `TestClient` imports `httpx2` and, falling back to `httpx`, raises a
  # `StarletteDeprecationWarning` -- which `-W error` turns into an import-time failure of the
  # whole web suite. Declared rather than filtered: a warnings filter is a suppression this
  # project counts, and the client the suite drives the ASGI app through is a test tool, so it
  # belongs in this group and never in the runtime dependencies.
  "httpx2>=2.13",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pre-commit>=4.0",
  "types-PyYAML",
  "types-regex>=2026.9.10.20260911",
  "complexipy>=8.0.1",
  "radon>=6.0.1",
  "vulture>=2.16",
  "pylint>=4.0.8",
  # Held below 4.15 for the same import and the same reason: anyio 4.15 deprecated the
  # `anyio.abc.BlockingPortal` alias that starlette 1.6's test client still uses, and under
  # `-W error` that deprecation fails the whole web suite at import. A dev-group constraint,
  # not a runtime one: the warning only bites a suite that treats warnings as errors.
  # Lift it when starlette imports the portal from `anyio.from_thread`.
  "anyio<4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threaddigest"]

# ---------------------------------------------------------------------------
# pytest
#   -m 'not live'    live tests are deselected here, so the skip ratchet stays at zero
#   --block-network  any socket connect inside a test raises (pytest-recording)
#   --strict-markers unknown markers are errors, so a typo cannot silently un-skip or un-gate
#   -W error         warnings are errors: PRAW deprecations and SQLAlchemy warnings surface now
# --cov is NOT here on purpose: the Makefile passes it so plain `uv run pytest` stays fast.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live' --block-network --strict-markers -W error"
xfail_strict = true
# The repo root on sys.path, plus tests/__init__.py + tests/db/__init__.py, so
# `from tests.db.sqlhelp import table_digest, read_run` resolves under the plain
# `pytest` console script (not just `python -m pytest`) from tests/services/,
# tests/e2e/ and tests/gates/ -- none of which is on the TID251 per-file-ignore list
# for text()/create_engine (design-round5.md §2.2, §2.3).
pythonpath = ["."]
markers = [
  "live: needs real Reddit credentials; never runs in CI",
  "slow: weekly jobs",
  "gate: positive control proving a guard can go red",
  "macos: needs macOS tooling (plutil, launchd); deselected on the Linux CI matrix, run on the Mac",
]

[tool.coverage.run]
source = ["threaddigest"]
branch = true

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# docs/ holds immutable reference copies; ruff formats fenced Python inside Markdown,
# so it must not see them.
extend-exclude = ["docs", ".claude"]

[tool.ruff.lint]
# PLW1514 is still a preview rule in ruff 0.16. explicit-preview-rules means only rules
# named by exact code (PLW1514) opt in; prefixes like "E" or "B" never pull in preview rules.
preview = true
explicit-preview-rules = true
select = [
  "E", "W",        # pycodestyle (includes E722 bare except)
  "F",             # pyflakes
  "I",             # isort
  "B",             # flake8-bugbear (includes B904 raise ... from inside except)
  "UP",            # pyupgrade
  "N",             # pep8-naming
  "S110", "S112",  # try-except-pass / try-except-continue
  "BLE",           # blind except
  "TRY",           # tryceratops: exception hygiene
  "PLW1514",       # open() without encoding= (Linux/Mac drift)
  "C901",          # complexity: size ratchet
  "PLR0915",       # too many statements: size ratchet
  "TID251",        # banned API (see below)
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-bugbear]
# typer/fastapi declare parameters through call expressions in defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.Query", "fastapi.Form"]

# Connection chokepoint and no-mocking-internals policy (docs/PLAN.md, Silent-failure controls).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.create_engine".msg = "Engines are created only in threaddigest.db.engine (WAL, foreign_keys, secure_delete are applied there)."
"sqlalchemy.text".msg = "Raw SQL lives inside threaddigest.db only; go through the repository or threaddigest.db.engine."
"sqlite3.connect".msg = "Open the database through threaddigest.db.engine, never sqlite3 directly."
"unittest.mock.patch".msg = "Do not patch internals: test through the fake gateway (threaddigest.adapters.reddit_fake) and a real temp DB. Allowed only under tests/adapters/."

# Ruff can only lift TID251 as a whole per path, not per banned name. db/ and tests/db/ are
# lifted for create_engine/text/sqlite3; tests/adapters/ for mock.patch. Review keeps the split.
[tool.ruff.lint.per-file-ignores]
"src/threaddigest/db/**" = ["TID251"]
"tests/db/**" = ["TID251"]
"tests/adapters/**" = ["TID251"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
