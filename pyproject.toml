[project]
name = "insightminer"
version = "0.1.0"
description = "Personal, rules-compliant Reddit harvester that surfaces Premiere Pro quality signals"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "praw>=7.8",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "typer>=0.15",
  "rich>=13.9",
  "regex>=2024.11.6",
  "markdown-it-py>=3.0",
  "nh3>=0.2.18",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
]

[project.scripts]
insightminer = "insightminer.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-recording>=0.13",
  "responses>=0.25",
  "hypothesis>=6.115",
  "time-machine>=2.16",
  "pytest-alembic>=0.11",
  "selectolax>=0.3.21",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pre-commit>=4.0",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightminer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live' --block-network"
markers = [
  "live: needs real Reddit credentials; never runs in CI",
  "slow: weekly jobs",
  "gate: positive control proving a guard can go red",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
